<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Equipos</title>
    <link rel="stylesheet" href="inventario.css">
</head>
<body>

    <div class="contenedor">
        <table>
            <thead>
                <tr>
                    <th>Codigo</th>
                    <th>Equipo</th>
                    <th>Área</th>
                    <th>Estado</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>EQ-001</td>
                    <td>Computadora Dell</td>
                    <td>Administración</td>
                    <td><span class="operativo">Operativo</span></td>
                </tr>

                <tr>
                    <td>EQ-002</td>
                    <td>Laptop HP</td>
                    <td>Contabilidad</td>
                    <td><span class="mantenimiento">Mantenimiento</span></td>
                </tr>

                <tr>
                    <td>EQ-003</td>
                    <td>Computadora Lenovo</td>
                    <td>Informática</td>
                    <td><span class="operativo">Operativo</span></td>
                </tr>

                <tr>
                    <td>EQ-004</td>
                    <td>Impresora Epson</td>
                    <td>Secretaría</td>
                    <td><span class="pendiente">Pendiente</span></td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
